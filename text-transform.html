<!DOCTYPE html>
<html lang="en">
<head>
    <title>text-transform property</title>
    <style>
        #div{
            height: 100px;
            width: 300px;
            color:blueviolet;
            background-color: blue;
            text-transform: lowercase;
            text-align:center;
        }
    </style>
</head>
<body>
<h1 id="div">this side Aniket

</h1>    
</body>
</html>
