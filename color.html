<!DOCTYPE html>
<html lang="en">
<head>
    <title>viisibility</title>
    <style>
        .div{
           background-color: blue;
           visibility: visible;
        height:100px;
        width:100px;
        text-align:center
        }
        .div1{
            height: 100px;
            width: 100px;
            visibility: visible;
            background-color: aqua;
            text-align: center;
        }
 .div,.div1{
   margin-bottom:20px;
   padding: 10px;
}
    </style>
</head>
<body>
    <div class="div">box1</div>
    <div class="div1">box2</div>
    
</body>
</html>
